<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Dancing+Script:wght@500;700&family=Courier+Prime:wght@400;700&display=swap');

body,html{
  margin:0;
  padding:0;
  overflow-x:hidden;
}

.bw{
  font-family:'Courier Prime',monospace;
  background:#dce6f0;
  color:#1c2e4a;
}

/* NAV */
.bnav{
  background:rgba(168,197,192,0.95);
  padding:14px;
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}
.bnav a{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:white;
  text-decoration:none;
  opacity:0.6;
}

/* HERO */
.sh{
  display:flex;
  flex-direction:column;
}

.shl{
  padding:40px 20px;
  text-align:center;
  background:#f5ede0;
}

.hname{
  font-family:'Dancing Script';
  font-size:48px;
  color:#8fa8a8;
}

.hamp{
  font-size:32px;
  color:#c4a882;
}

.shr{
  background:#8fa8a8;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.pw{
  width:100%;
  max-width:400px;
  position:relative;
}

.pol{
  background:white;
  padding:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

.pol img{
  width:100%;
  height:auto;
  display:block;
  object-fit:cover;
  filter:grayscale(100%);
}

/* SECCIONES */
section{
  padding:40px 20px;
}

h2{
  font-family:'Dancing Script';
  font-size:32px;
  color:#8fa8a8;
  text-align:center;
}

p{
  font-size:14px;
  line-height:1.6;
  text-align:center;
}

/* HORARIOS */
.tkt{
  background:white;
  padding:16px;
  margin-bottom:12px;
}

/* GALERÍA */
.gallery-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.gallery-grid img{
  width:100%;
  height:auto;
  display:block;
}

/* REGALO */
.reg-card{
  background:white;
  padding:20px;
  text-align:center;
}

/* FORM */
.rfrm{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.rfrm input,
.rfrm textarea{
  padding:10px;
  border:1px solid #ccc;
}

/* BOTÓN */
.rbtn{
  background:#c4a882;
  border:none;
  padding:12px;
  cursor:pointer;
}

/* DESKTOP */
@media(min-width:768px){

  .sh{
    flex-direction:row;
  }

  .shl, .shr{
    width:50%;
  }

  .gallery-grid{
    grid-template-columns:1fr 1fr 1fr;
  }

}
</style>
</head>

<body class="bw">

<!-- NAV -->
<div class="bnav">
  <a href="#inicio">Inicio</a>
  <a href="#nosotros">Nos casamos</a>
  <a href="#horarios">Horarios</a>
  <a href="#galeria">Fotos</a>
  <a href="#regalo">Regalo</a>
  <a href="#rsvp">Confirmación</a>
</div>

<!-- HERO -->
<section id="inicio" class="sh">
  <div class="shr">
    <div class="pw">
      <div class="pol">
        <img src="https://via.placeholder.com/400x500" alt="">
      </div>
    </div>
  </div>

  <div class="shl">
    <div class="hname">Ana</div>
    <div class="hamp">&</div>
    <div class="hname">Luis</div>
    <p>Nos casamos</p>
  </div>
</section>

<!-- NOS CASAMOS -->
<section id="nosotros">
  <h2>Nos casamos</h2>
  <p>Queremos compartir este momento contigo.</p>
</section>

<!-- HORARIOS -->
<section id="horarios">
  <h2>Horarios</h2>
  <div class="tkt">Ceremonia - 17:00</div>
  <div class="tkt">Cena - 19:00</div>
</section>

<!-- GALERÍA -->
<section id="galeria">
  <h2>Galería</h2>
  <div class="gallery-grid">
    <img src="https://via.placeholder.com/400">
    <img src="https://via.placeholder.com/400">
    <img src="https://via.placeholder.com/400">
  </div>
</section>

<!-- REGALO -->
<section id="regalo">
  <h2>Regalo</h2>
  <div class="reg-card">
    IBAN: ES00 0000 0000 0000
  </div>
</section>

<!-- RSVP -->
<section id="rsvp">
  <h2>Confirmación</h2>
  <form class="rfrm">
    <input placeholder="Nombre">
    <textarea placeholder="Mensaje"></textarea>
    <button class="rbtn">Enviar</button>
  </form>
</section>

</body>
</html>
